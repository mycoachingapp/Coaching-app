<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeMeta" content="#4f46e5">
<title>Coaching Center</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4f46e5;--p2:#0ea5e9;--pl:#eef2ff;--g:#16a34a;--gl:#dcfce7;--r:#dc2626;--rl:#fee2e2;--mu:#64748b;--bd:#e5e7eb;--bg:#f4f6fb;--side:250px}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;max-width:100%}
img,table,pre{max-width:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:#0f172a;font-size:14.5px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:14.5px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #dbe1ea;border-radius:10px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
button{padding:10px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;cursor:pointer;font-weight:600;transition:transform .1s,box-shadow .15s;box-shadow:0 4px 12px #0000001a}
button:active{transform:scale(.97)}
button.sec{background:#eef1f6;color:#1e293b;box-shadow:none}
button.red{background:linear-gradient(135deg,#ef4444,#f97316)}
button.grn{background:linear-gradient(135deg,#16a34a,#10b981)}
button.sm{padding:6px 11px;font-size:13px;border-radius:8px}
button.ghost{background:none;color:inherit;box-shadow:none;padding:6px 8px}
a.btn{display:inline-block;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;color:#fff;margin:2px 0}
a.wa{background:linear-gradient(135deg,#22c55e,#15803d)} a.sms{background:linear-gradient(135deg,#0ea5e9,#2563eb)} a.sent{opacity:.4}
a{color:var(--p)}

/* ---- Sidebar ---- */
#side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:linear-gradient(165deg,var(--p),var(--p2));color:#fff;display:flex;flex-direction:column;padding:18px 14px;z-index:40;transition:transform .25s ease;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:#ffffff33;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.brand b{font-size:15.5px;line-height:1.25;display:block}
.brand small{opacity:.8;font-size:12px}
.sessbox{margin-top:16px;background:#ffffff1f;border-radius:12px;padding:10px}
.sessbox label{color:#fffc;margin-bottom:4px}
#side select{background:#ffffff2b;color:#fff;border:1px solid #ffffff55;padding:8px 10px}
#side select option{color:#000}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:14px;flex:1}
.nav button{background:transparent;color:#ffffffe0;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;font-weight:500;box-shadow:none}
.nav button:hover{background:#ffffff22}
.nav button.on{background:#fff;color:var(--p);font-weight:600;box-shadow:0 8px 18px #0000002a}
.nav .ic{font-size:18px;width:24px;text-align:center}
.sidefoot{border-top:1px solid #ffffff33;padding-top:10px;font-size:12px;opacity:.9;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidefoot button{background:#ffffff26;box-shadow:none;padding:7px 12px;font-size:13px}
#scrim{display:none;position:fixed;inset:0;background:#0f172a80;z-index:35}

.wrap{margin-left:var(--side);min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:#ffffffeb;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:12px}
.topbar h2{margin:0;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary h3{margin:0}
details.fold .foldhint::after{content:'Show \25BE'}
details.fold[open] .foldhint::after{content:'Hide \25B4'}
#backBtn{font-size:20px;background:var(--pl);color:var(--p);box-shadow:none;padding:6px 12px}
#menuBtn{display:none;font-size:22px;background:var(--pl);color:var(--p);box-shadow:none;padding:6px 11px}
.chip{background:var(--pl);color:var(--p);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
main{padding:18px;max-width:1150px;margin:auto;padding-bottom:40px}

/* ---- Cards ---- */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0f172a0d;border:1px solid #eef0f5}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:5px;height:18px;border-radius:4px;background:linear-gradient(var(--p),var(--p2))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 22px #0f172a1f}
.stat b{display:block;font-size:24px;font-weight:700}
.stat span{font-size:12.5px;opacity:.92}
.stat .ic{position:absolute;right:12px;top:10px;font-size:32px;opacity:.35}
.c1{background:linear-gradient(135deg,#6366f1,#3b82f6)} .c2{background:linear-gradient(135deg,#10b981,#059669)}
.c3{background:linear-gradient(135deg,#8b5cf6,#d946ef)} .c4{background:linear-gradient(135deg,#f43f5e,#f97316)}
.c5{background:linear-gradient(135deg,#f59e0b,#ef4444)} .c6{background:linear-gradient(135deg,#06b6d4,#0ea5e9)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:150px}
label{font-size:12.5px;color:var(--mu);display:block;margin-bottom:4px;font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid #eef0f5;text-align:left;vertical-align:middle}
tr.hd th{background:var(--pl);color:var(--p);font-weight:600;white-space:nowrap;font-size:13px}
tr.hd th:first-child{border-radius:10px 0 0 10px} tr.hd th:last-child{border-radius:0 10px 10px 0}
tbody tr:hover td{background:#fafbff}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.tg{background:var(--gl);color:var(--g)} .tr{background:var(--rl);color:var(--r)} .tx{background:#e2e8f0;color:#475569}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.m{border:2px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;user-select:none;transition:transform .1s;background:#fff}
.m b{display:block;font-size:14px}
.m.paid{background:var(--gl);border-color:#86efac}
.m.due{background:var(--rl);border-color:#fca5a5;cursor:pointer}
.m.open{cursor:pointer}
.m.sel{border-color:var(--p);background:var(--pl);box-shadow:0 0 0 3px var(--p);transform:scale(1.03)}
.m.na{opacity:.4}
.mu{color:var(--mu);font-size:12.5px}
.clsh{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:7px 12px;border-radius:10px;font-weight:600;margin:14px 0 6px}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:14px;flex-shrink:0}
.who{display:flex;gap:10px;align-items:center}

/* ---- Frozen action bar ---- */
.actionbar{position:sticky;bottom:10px;z-index:20;margin-top:16px;padding:12px 14px;background:#ffffffee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px #0f172a26}
.actionbar .grow{flex:1;min-width:140px;font-weight:600}

/* ---- Login ---- */
#gate,#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--p),var(--p2))}
.loginbox{background:#fff;padding:30px 26px;border-radius:22px;width:100%;max-width:360px;box-shadow:0 25px 60px #0004;text-align:center}
.loginbox .logo{margin:0 auto 10px;background:linear-gradient(135deg,var(--p),var(--p2));width:60px;height:60px;font-size:30px;border-radius:18px}

/* ---- Modal ---- */
#modal{position:fixed;inset:0;background:#0f172a8c;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
#modal .box{background:#fff;border-radius:18px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px #0005}
.mhead{padding:16px 18px 8px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.mbody{padding:4px 18px 14px;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:10px;flex-wrap:wrap;background:#f8fafc;border-radius:0 0 18px 18px}
.mfoot>*{flex:1}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:99;max-width:90vw;box-shadow:0 10px 30px #0004}
#busy{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--p),var(--p2),var(--p));background-size:200% 100%;animation:bz 1s linear infinite;display:none;z-index:99}
@keyframes bz{to{background-position:-200% 0}}
pre.msg{white-space:pre-wrap;background:var(--pl);border-radius:12px;padding:12px;font-family:inherit;font-size:13.5px;margin:6px 0}

/* ---- Mobile ---- */
@media(max-width:900px){
  #side{transform:translateX(-105%)} #side.open{transform:none;box-shadow:0 0 50px #0006}
  #scrim.show{display:block}
  .wrap{margin-left:0} #menuBtn{display:inline-block}
  main{padding:12px;padding-bottom:30px}
  .topbar{padding:8px 12px}
  .topbar h2{font-size:16px}
}
@media(max-width:700px){
  .row>*{min-width:100%}
  .row.keep>*{min-width:0}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:13px}.stat b{font-size:20px}
  table.rt tr.hd{display:none}
  table.rt,table.rt tbody{display:block}
  table.rt tr{display:block;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;padding:8px 12px;background:#fff;box-shadow:0 2px 8px #0f172a0a}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;text-align:right}
  table.rt td::before{content:attr(data-l);color:var(--mu);font-size:12px;text-align:left;flex-shrink:0}
  table.rt td.full{display:block;text-align:left}
  table.rt td.full::before{display:none}
  table.rt td input,table.rt td select{max-width:68%}
  tbody tr:hover td{background:none}
  #modal{align-items:flex-end;padding:0}
  #modal .box{border-radius:20px 20px 0 0;max-width:100%;max-height:94vh}
  .mfoot{border-radius:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .actionbar{bottom:8px;flex-wrap:nowrap;padding:10px;gap:8px}
  .actionbar .grow{min-width:0;font-size:12.5px;line-height:1.3}
  .actionbar button{padding:10px 12px;white-space:nowrap;font-size:13.5px}
  .mgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .m{padding:8px 4px;font-size:11.5px}
}
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  .rc{border:2px solid #000;padding:16px;max-width:520px;margin:auto;font-size:14px}
  .rc table td,.rc table th{border:1px solid #000}
}
</style>
</head>

<script>

const SELLER_CONTACT = { name: 'Sujay Mukhopadhyay', phone: '8768483938' };
const QS = new URLSearchParams(location.search);
const MODE = QS.get('p') || '';
window.onerror = function (m, s, l) {
  var d = document.createElement('div');

<div id="busy"></div>
<div id="toast"></div>

<div id="gate" hidden>
  <div class="loginbox">
    <div class="logo">&#x1f511;</div>
    <h2 style="margin:0 0 4px" id="gateTitle">Activate app</h2>
    <p class="mu" style="margin-top:0" id="gateMsg">Enter the licence code you received</p>
    <div id="gateForm"><input id="licCode" placeholder="Licence code, e.g. SC001" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')activate()">
    <button style="width:100%;margin-top:14px" onclick="activate()">Activate</button></div>
    <div id="gateContact" style="margin-top:14px"></div>
  </div>
</div>

<div id="login" hidden>
  <div class="loginbox">
    <div class="logo">&#x1f393;</div>
    <h2 style="margin:0 0 4px" id="loginCenter">Coaching Center</h2>
    <p class="mu" style="margin-top:0">Enter admin password</p>
    <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button style="width:100%;margin-top:14px" onclick="login()">Login</button>
    <p class="mu" id="themeName1" style="margin-bottom:0"></p>

</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><div class="logo">&#x1f393;</div><div><b id="cname">Coaching Center</b><small id="themeName2"></small></div></div>
    <div class="sessbox"><label>Session</label><select id="sessSel" onchange="changeSession(this.value)"></select></div>
    <div class="nav" id="tabs"></div>
    <div class="sidefoot"><span id="todayTxt"></span><button onclick="logout()">Logout</button></div>
  </aside>
  <div id="scrim" onclick="toggleSide(false)"></div>
  <div class="wrap">
    <div class="topbar"><button id="menuBtn" onclick="toggleSide(true)">&#x2630;</button><button id="backBtn" hidden onclick="history.back()" title="Back">&#x2190;</button><h2 id="pageTitle"></h2><span class="chip" id="sessChip"></span></div>
    <main id="view"></main>
  </div>
</div>

<div id="publicView" hidden></div>

<div id="modal" hidden onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div id="printArea"></div>

<script>
// ================= Day-wise theme =================
const THEMES = [
  ['Sunset Sunday',   '#f97316', '#db2777', '#fff1e8'],
  ['Ocean Monday',    '#4f46e5', '#0ea5e9', '#eef2ff'],
  ['Mint Tuesday',    '#0d9488', '#22c55e', '#e7faf5'],
  ['Berry Wednesday', '#9333ea', '#ec4899', '#f6edff'],
  ['Golden Thursday', '#d97706', '#e11d48', '#fff6e5'],
  ['Sky Friday',      '#0284c7', '#06b6d4', '#e6f5ff'],
  ['Royal Saturday',  '#7c3aed', '#2563eb', '#f1ecff']
];
const THEME = THEMES[new Date().getDay()];
(function applyTheme() {
  const r = document.documentElement.style;
  r.setProperty('--p', THEME[1]); r.setProperty('--p2', THEME[2]); r.setProperty('--pl', THEME[3]);
  try { const m = document.getElementById('themeMeta'); if (m) m.setAttribute('content', THEME[1]); } catch (e) {}
})();

// ================= State & helpers =================
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ACTIVE = 'Active', INACTIVE = 'Inactive';
const AV = ['#6366f1','#10b981','#f43f5e','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#14b8a6'];
const S = { pw:'', settings:{}, sessions:[], session:'', students:[], payments:[], notes:[], paid:{}, url:'', tab:'dash',
            f:{cls:'', q:'', st:ACTIVE}, fee:{cls:'', id:'', sel:new Set()}, due:{cls:'', mode:'due'}, bulk:null, exams:[],
            at:{cls:'', date:'', cur:{}, all:{}, loadedKey:'', saved:false, per:'this'}, ex:{cls:'', id:''} };
const TABS = [['dash','\u{1f4ca}','Dashboard'],['students','\u{1f468}\u{200d}\u{1f393}','Students'],['fee','\u{1f4b0}','Fee Collection'],['due','\u{1f514}','Dues & Messages'],['attdash','\u{1f4c8}','Attendance Dashboard'],['att','\u{1f4cb}','Take Attendance'],['exam','\u{1f3c6}','Exams & Marks'],
              ['notes','\u{1f4da}','Notes (PDF)'],['year','\u{1f393}','New Year'],['settings','\u{2699}\u{fe0f}','Settings']];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '\u{20b9}' + Number(n || 0).toLocaleString('en-IN');
const ym = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const mLabel = m => { const [y, mm] = String(m).split('-'); return (MN[+mm - 1] || m) + ' ' + (y || ''); };
const mShort = m => { const [y, mm] = String(m).split('-'); return (MS[+mm - 1] || m) + " '" + String(y).slice(2); };
const clsName = c => /^\d+$/.test(String(c)) ? 'Class ' + c : String(c);
const classes = () => String(S.settings.Classes || '').split(',').map(x => x.trim()).filter(Boolean);
const sum = (a, f) => a.reduce((t, x) => t + (Number(f(x)) || 0), 0);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const td = (l, h, cls) => `<td data-l="${esc(l)}"${cls ? ` class="${cls}"` : ''}>${h}</td>`;
const avatar = name => { const n = String(name || '?').trim(); let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<span class="avatar" style="background:${AV[h % AV.length]}">${esc(n.charAt(0).toUpperCase())}</span>`; };

function sessMonths(name) {
  const y = parseInt(name, 10), sm = parseInt(S.settings.SessionStartMonth, 10) || 1, a = [];
  for (let i = 0; i < 12; i++) { const k = sm - 1 + i; a.push((y + Math.floor(k / 12)) + '-' + String(k % 12 + 1).padStart(2, '0')); }
  return a;
}
function call(action, p) {
  if (S.lic && S.lic.demo) {
    return new Promise((res, rej) => setTimeout(() => {
      try { const v = demoCall(action, p || {}); res(v === undefined ? null : JSON.parse(JSON.stringify(v))); } catch (e) { rej(e); }
    }, 120));
  }
  $('busy').style.display = 'block';
  return new Promise((res, rej) => {
    fetch(S.server, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                      body: JSON.stringify({ pw: S.pw, action: action, p: p || {} }) })
      .then(r => r.json())
      .then(r => { $('busy').style.display = 'none'; (r && r.ok) ? res(r.data) : rej(new Error(r ? r.err : 'Server error')); })
      .catch(e => { $('busy').style.display = 'none'; rej(new Error(navigator.onLine ? 'Cannot reach the server. Try again.' : 'No internet connection.')); });
  });
}
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', ms || 3000); }
function openModal(title, body, foot) {
  $('modalBox').innerHTML = `<div class="mhead"><span>${title}</span><button class="ghost" onclick="closeModal()">\u{2715}</button></div>
    <div class="mbody">${body}</div>${foot ? `<div class="mfoot">${foot}</div>` : ''}`;
  $('modal').hidden = false;
}
function closeModal() { $('modal').hidden = true; }
function toggleSide(open) { $('side').classList.toggle('open', open); $('scrim').classList.toggle('show', open); }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function clsIdx(c) { const i = classes().indexOf(c); return i < 0 ? 999 : i; }
function sortStu(a) { return a.slice().sort((x, y) => clsIdx(x.Class) - clsIdx(y.Class) || (parseInt(x.Roll) || 9999) - (parseInt(y.Roll) || 9999) || x.Name.localeCompare(y.Name)); }
function stuById(id) { return S.students.find(s => s.ID === id); }
function buildIndex() { S.paid = {}; S.payments.forEach(p => { (S.paid[p.StudentID] = S.paid[p.StudentID] || {})[p.Month] = p; }); }
function dueMonths(st) {
  if (st.Status !== ACTIVE) return [];
  const cur = ym(), pm = S.paid[st.ID] || {};
  return sessMonths(st.Session).filter(m => m >= (st.StartMonth || '') && m <= cur && !pm[m]);
}

async function login(saved) {
  S.pw = saved || $('pw').value;
  if (!S.pw) return;
  try {
    const d = await call('init');
    S.settings = d.settings; S.sessions = d.sessions; S.url = location.origin + location.pathname;
    S.session = S.settings.CurrentSession;
    // First login: take the centre name from the licence list if the sheet still has the default name
    if (S.lic && S.lic.center && /^(My Coaching Center|\u{0986}\u{09ae}\u{09be}\u{09b0} .*|)$/u.test(String(S.settings.CenterName || '').trim())) {
      try { S.settings = Object.assign(S.settings, await call('saveSettings', { CenterName: S.lic.center })); } catch (e) {}
    }
    if (!(S.lic && S.lic.demo)) store('cc_pw', S.pw);
    $('login').hidden = true; $('app').hidden = false;
    await loadData();
  } catch (e) { store('cc_pw', null); $('login').hidden = false; toast(e.message); }
}
function logout() { store('cc_pw', null); location.reload(); }
async function loadData() {
  const d = await call('data', { Session: S.session });

  $('sessSel').innerHTML = S.sessions.map(s => `<option ${s === S.session ? 'selected' : ''}>${esc(s)}</option>`).join('');
  $('tabs').innerHTML = TABS.map(([k, ic, t]) => `<button class="${k === S.tab || (k === 'students' && S.tab === 'bulk') || (k === 'exam' && (S.tab === 'marks' || S.tab === 'examatt')) ? 'on' : ''}" onclick="go('${k}')"><span class="ic">${ic}</span>${t}</button>`).join('');

function go(t, fromHistory) {
  if (!fromHistory && t !== S.tab) { try { history.pushState({ tab: t }, '', location.pathname + location.search); } catch (e) {} }
  S.tab = t; toggleSide(false); renderShell(); render(); window.scrollTo(0, 0);
  $('backBtn').hidden = (t === 'dash');
}
// Phone back button / browser back: close a popup or the menu first, otherwise go to the previous page (finally the Dashboard)
window.addEventListener('popstate', e => {
  if (!$('modal').hidden) { closeModal(); try { history.pushState({ tab: S.tab }, '', location.pathname + location.search); } catch (x) {} return; }
  if ($('side').classList.contains('open')) { toggleSide(false); try { history.pushState({ tab: S.tab }, '', location.pathname + location.search); } catch (x) {} return; }
  if ($('app').hidden) return;
  go((e.state && e.state.tab) || 'dash', true);
});
// Backspace (outside a text box) works like Back
document.addEventListener('keydown', e => {
  if (e.key !== 'Backspace' || $('app').hidden) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
  e.preventDefault();
  if (!$('modal').hidden) return closeModal();

});

  const clsRows = byCls.map(c => {

    <tr class="hd"><th>Class</th><th>Students</th><th>Paid for ${MN[new Date().getMonth()]}</th><th>With dues</th><th>Due amount</th></tr>
    ${clsRows || '<tr><td class="full mu">No students added yet \u{2014} go to Students to add.</td></tr>'}</table></div></div>
  <details class="card fold" ${load('cc_mw') === '1' ? 'open' : ''} ontoggle="store('cc_mw', this.open ? '1' : '0')">

function readB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); }); }
async function uploadNotes() {
  const files = [...$('nFile').files], cls = $('nCls').value, title = $('nTitle').value.trim();
  if (!files.length) return toast('Choose file(s) first');
  S.nCls = cls; let done = 0;
  for (const f of files) {
    if (f.size > 25 * 1024 * 1024) { toast(f.name + ' \u{2014} larger than 25 MB, skipped'); continue; }
    $('nProg').textContent = `\u{23f3} Uploading (${done + 1}/${files.length}): ${f.name} ...`;
    try {
      const data = await readB64(f);
      await call('uploadNote', { Session: S.session, Class: cls, Title: files.length > 1 ? (title ? title + ' \u{2014} ' : '') + f.name.replace(/\.[^.]+$/, '') : title,
        FileName: f.name, MimeType: f.type || 'application/pdf', Data: data });
      done++;
    } catch (e) { toast(f.name + ': ' + e.message, 5000); }
  }
  toast('\u{2705} ' + plural(done, 'file') + ' uploaded'); await loadData();
}
async function delNote(id) {
  if (!confirm('Delete this note? (The file goes to Drive Trash)')) return;

}

function grade(p) { return p >= 90 ? 'A+' : p >= 80 ? 'A' : p >= 70 ? 'B+' : p >= 60 ? 'B' : p >= 50 ? 'C' : p >= 40 ? 'D' : 'F'; }

const hasMark = v => v !== undefined && v !== null && String(v).trim() !== '' && String(v).trim().toUpperCase() !== 'P';
function examStats(e) {
  const vals = Object.keys(e.Marks || {}).map(k => e.Marks[k]).filter(v => hasMark(v) && !isAb(v)).map(Number).filter(v => !isNaN(v));
  const full = Number(e.FullMarks) || 0;
  return { n: vals.length, hi: vals.length ? Math.max(...vals) : 0, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0, full };
}
function examById(id) { return S.exams.find(e => e.ExamID === id); }

function demoCall(action, p) {

    case 'saveExam': { if (!String(p.Name || '').trim()) throw new Error('Enter the exam name'); if (!(Number(p.FullMarks) > 0)) throw new Error('Enter full marks');

    }
    case 'saveStudentsBulk': (p.List || []).forEach(x => D.students.push(Object.assign({}, x, { ID: 'S' + String(nextNum(D.students, 'ID')).padStart(4, '0'), Session: p.Session, Status: 'Active', JoinDate: today }))); return (p.List || []).length;
    case 'deleteStudent': if (D.payments.some(x => x.StudentID === p.ID)) throw new Error('This student has fee records. Instead of deleting, set the status to "Inactive".'); D.students = D.students.filter(x => x.ID !== p.ID); return true;

      months.forEach(m => D.payments.push({ ReceiptNo: rno, Date: today, StudentID: stu.ID, Session: stu.Session, Month: m, Amount: Number(p.PerMonth) || 0, Mode: p.Mode || 'Cash', Note: p.Note || '' }));
      return { ReceiptNo: rno, Date: today };

}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function normDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); // dd/mm/yyyy
  const d = new Date(s); return isNaN(d) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function loadSheetLicences() {
  const url = LICENCE_SHEET_CSV + (LICENCE_SHEET_CSV.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
  const r = await fetch(url);
  if (!r.ok) throw new Error('sheet ' + r.status);
  const rows = parseCSV(await r.text()).filter(x => x.some(v => String(v).trim()));
  if (rows.length < 1) throw new Error('empty sheet');
  const head = rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, ''));
  const col = names => head.findIndex(h => names.indexOf(h) > -1);
  const iC = col(['code']), iN = col(['centername', 'center', 'name']), iS = col(['serverurl', 'server', 'url']),
        iE = col(['expiry', 'expirydate']), iT = col(['status']);
  if (iC < 0 || iS < 0) throw new Error('sheet columns not found');
  const list = {};
  rows.slice(1).forEach(x => {
    const code = String(x[iC] || '').trim(); if (!code) return;
    list[code] = { center: iN > -1 ? String(x[iN] || '').trim() : '', server: String(x[iS] || '').trim(),
                   expiry: iE > -1 ? normDate(x[iE]) : '', status: iT > -1 ? (String(x[iT] || '').trim() || 'Active') : 'Active' };
  });
  return list;
}
async function checkLicence(code) {
  let list = null, contact = SELLER_CONTACT;
  if (!/PASTE_/.test(LICENCE_SHEET_CSV)) { try { list = await loadSheetLicences(); } catch (e) { console.warn('Licence sheet:', e.message); } }
  if (!list) {
    try {
      await loadLicences();
      if (typeof LICENSES !== 'undefined') { list = LICENSES; if (typeof SELLER !== 'undefined' && SELLER) contact = SELLER; }
    } catch (e) {}
  }
  if (!list) {
    // Offline: use the last good answer if it has not expired
    let old = null; try { old = JSON.parse(load('cc_lic') || 'null'); } catch (x) {}
    const today = new Date().toISOString().slice(0, 10);
    if (old && old.ok && old.code === code && (!old.expiry || old.expiry >= today)) return old;
    throw new Error(navigator.onLine ? 'Could not load the licence list. Try again.' : 'No internet connection.');
  }
  let row = null;
  Object.keys(list).forEach(k => { if (String(k).trim().toUpperCase() === code) row = list[k]; });
  if (!row) return { ok: false, reason: 'notfound', contact: contact };
  const today = new Date().toISOString().slice(0, 10);
  const expiry = normDate(row.expiry);
  const base = { code: code, center: row.center || '', expiry: expiry, contact: contact };
  let r;
  if (String(row.status || 'Active').toLowerCase() === 'blocked') r = Object.assign({ ok: false, reason: 'blocked' }, base);
  else if (expiry && expiry < today) r = Object.assign({ ok: false, reason: 'expired' }, base);
  else if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(String(row.server || '').trim())) r = Object.assign({ ok: false, reason: 'noserver' }, base);
  else r = Object.assign({ ok: true, server: String(row.server).trim() }, base);
  store('cc_lic', JSON.stringify(r));
  return r;
}
async function activate() {
  const code = $('licCode').value.trim().toUpperCase(); if (!code) return;
  await openWithCode(code);
}
async function openWithCode(code) {
  S.licCode = code;
  if (code === 'DEMO') {
    DEMO.db = demoDB();
    S.lic = { ok: true, demo: true, code: 'DEMO', center: 'Demo Coaching Centre', expiry: '', contact: SELLER_CONTACT };
    S.server = null;
    $('gate').hidden = true; $('loginCenter').textContent = 'Demo Coaching Centre';
    $('pw').placeholder = 'Demo password: 1234';
    if (MODE === 'notes') return publicNotes();
    $('login').hidden = false; return;
  }
  $('busy').style.display = 'block';
  let lic;
  try { lic = await checkLicence(code); } catch (e) { $('busy').style.display = 'none'; showGate('', null); $('gateMsg').textContent = e.message; $('licCode').value = code; return; }
  $('busy').style.display = 'none';
  if (!lic.ok) { if (lic.reason === 'notfound') store('cc_code', null); showGate(lic.reason, lic); $('licCode').value = code; return; }
  S.lic = lic; S.server = lic.server; store('cc_code', code);
  if (QS.get('c') !== code) { try { history.replaceState(null, '', location.pathname + '?c=' + encodeURIComponent(code) + (MODE ? '&p=' + MODE : '')); } catch (e) {} }
  $('gate').hidden = true;
  if (lic.center) { $('loginCenter').textContent = lic.center; document.title = lic.center; }
  if (MODE === 'notes') return publicNotes();
  const p = load('cc_pw');
  if (p) { login(p); setTimeout(() => { if ($('app').hidden) $('login').hidden = false; }, 15000); } else $('login').hidden = false;
}
function licBanner() {
  if (!S.lic || !S.lic.expiry) return '';
  const days = Math.ceil((new Date(S.lic.expiry + 'T23:59:59') - new Date()) / 86400000);
  if (days > 15) return '';
  return `<div class="card" style="background:#fff7ed;border-color:#fed7aa"><b>Licence ends on ${esc(S.lic.expiry)}</b> (${days} day${days === 1 ? '' : 's'} left). Please renew to keep using the app.<div style="margin-top:8px">${contactHTML(S.lic.contact)}</div></div>`;
}
function start() {
  const code = (QS.get('c') || load('cc_code') || '').trim().toUpperCase();
  if (code) openWithCode(code); else showGate('nocode', null);
}

try { history.replaceState({ tab: 'dash' }, '', location.pathname + location.search); } catch (e) {}
// ===== Install as an app (Android Chrome / Edge / desktop) =====
window._inst = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._inst = e; try { if (S.tab === 'settings' || S.tab === 'dash') render(); } catch (x) {} });
window.addEventListener('appinstalled', () => { window._inst = null; toast('\u{2705} App installed'); });
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
async function installApp() {
  if (window._inst) { window._inst.prompt(); try { await window._inst.userChoice; } catch (e) {} window._inst = null; render(); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openModal('Install on this phone', ios

    : '<p>In <b>Chrome</b>: tap the <b>\u{22ee}</b> menu (top right) \u{2192} <b>Install app</b> or <b>Add to Home screen</b> \u{2192} <b>Install</b>.</p><p class="mu">The app icon will appear on your home screen and open full-screen like a normal app.</p>',
    '<button class="sec" onclick="closeModal()">OK</button>');
}
function installCard() {
  if (isStandalone()) return '';
  return `<div class="card"><h3>Install on this phone</h3><p class="mu" style="margin-top:0">Put the app on your home screen \u{2014} opens full-screen, no browser needed.</p><button onclick="installApp()">\u{1f4f2} Install app</button></div>`;
}
start();
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
